# 2.0.36 (pedido del usuario, 23/11/2026: «que no tenga que descargar nada, como Virtual Pet»).
# Cuando a main llega una versión (Directory.Build.props) que todavía no está publicada, GitHub arma Actualizador en Windows,
# corre las pruebas y la publica con build\Publicar.ps1: la misma entrega que arma Publicar.cmd en una PC (y crea la etiqueta
# v<versión>). Los equipos la instalan solos al abrir. Si la versión ya está publicada, no hace nada.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: ¿Ya está publicada esta versión?
        id: version
        shell: powershell
        run: |
          [xml]$p = Get-Content -LiteralPath Directory.Build.props -Raw -Encoding UTF8
          $v = $p.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1
          $ErrorActionPreference = 'Continue'
          gh release view "v$v" --repo $env:GITHUB_REPOSITORY 2>&1 | Out-Null
          $ya = ($LASTEXITCODE -eq 0)
          if ($ya) { Write-Host "La versión v$v ya está publicada: no se hace nada." } else { Write-Host "Se publica la versión v$v." }
          "publicada=$($ya.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0

      - name: Compilar, probar y publicar
        if: steps.version.outputs.publicada != 'true'
        shell: powershell
        run: |
          & .\build\Publicar.ps1 -Repo $env:GITHUB_REPOSITORY -ConPruebas
          if (-not $?) { exit 1 }
