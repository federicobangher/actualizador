# 2.0.36 (pedido del usuario, 23/11/2026: «que no tenga que descargar nada, como Virtual Pet»).
# Cuando a main llega una versión (Directory.Build.props) que todavía no está publicada, GitHub arma Actualizador en Windows,
# corre las pruebas y la publica con build\Publicar.ps1: la misma entrega que arma Publicar.cmd en una PC (y crea la etiqueta
# v<versión>). Los equipos la instalan solos al abrir. Si la versión ya está publicada, no hace nada.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      # 2.0.44 (auditoría): las acciones fijadas por su commit, no por la etiqueta «v4» (una etiqueta se puede mover y este trabajo
      # tiene permiso para publicar versiones). Son los commits a los que apuntaba «v4» el 26/11/2026.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      # 2.0.44: los guiones los ejecuta el técnico con Windows PowerShell 5.1; un error de sintaxis aparece recién en su equipo.
      - name: Revisar la sintaxis de los guiones (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $mal = 0
          foreach ($f in @(Get-ChildItem -Path build, deploy -Filter *.ps1 -Recurse)) {
            $tokens = $null; $errores = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errores)
            foreach ($e in @($errores)) { Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $mal++ }
          }
          if ($mal -gt 0) { exit 1 }
          Write-Host 'Sintaxis correcta.'

      - name: ¿Ya está publicada esta versión?
        id: version
        shell: powershell
        run: |
          [xml]$p = Get-Content -LiteralPath Directory.Build.props -Raw -Encoding UTF8
          $v = $p.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1
          $ErrorActionPreference = 'Continue'
          gh release view "v$v" --repo $env:GITHUB_REPOSITORY 2>&1 | Out-Null
          $ya = ($LASTEXITCODE -eq 0)
          if ($ya) { Write-Host "La versión v$v ya está publicada: no se hace nada." } else { Write-Host "Se publica la versión v$v." }
          "publicada=$($ya.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0

      # 2.0.46: la firma propia de las versiones (Firmar.cmd): se crea una clave de PRUEBA (sin contraseña, se borra al final), se firma,
      # se verifica con los guiones y se deja el resultado para que las pruebas del programa (VersionSignature) lo verifiquen también:
      # así se comprueba que lo que firma Windows PowerShell 5.1 lo acepta Actualizador.
      - name: Firma de versiones (clave de prueba)
        shell: powershell
        run: |
          . .\build\Comun.ps1
          . .\build\Firma.ps1
          $cert = New-ClaveDeFirma -Nombre $NombreClavePrueba -SinContrasena
          try {
            $sha = ('ab' * 32)
            $texto = New-TextoFirma -Cert $cert -Archivo 'Actualizador-9.9.9.zip' -Version '9.9.9' -Sha256 $sha
            $linea = Get-LineaClavePublica $cert
            $dir = Join-Path $env:RUNNER_TEMP 'firma-prueba'
            New-Item -ItemType Directory -Path (Join-Path $dir 'res') -Force | Out-Null
            [IO.File]::WriteAllText((Join-Path $dir 'res\claves-de-firma.txt'), "# prueba`r`n$linea`r`n")
            $claves = @(Get-ClavesDeFirma $dir)
            if ($claves.Count -ne 1) { throw 'Get-ClavesDeFirma no leyó la clave' }
            $p = Test-FirmaEntrega -Texto $texto -Archivo 'Actualizador-9.9.9.zip' -Version '9.9.9' -Sha256 $sha -Claves $claves
            if ($p) { throw "la firma válida no verificó: $p" }
            if (-not (Test-FirmaEntrega -Texto $texto -Archivo 'Actualizador-9.9.9.zip' -Version '9.9.8' -Sha256 $sha -Claves $claves)) { throw 'aceptó otra versión' }
            if (-not (Test-FirmaEntrega -Texto $texto -Archivo 'Actualizador-9.9.9.zip' -Version '9.9.9' -Sha256 ('cd' * 32) -Claves $claves)) { throw 'aceptó otro SHA-256' }
            $m = [regex]::Match($texto, 'firma: (\S+)')
            $b = [Convert]::FromBase64String($m.Groups[1].Value); $b[10] = $b[10] -bxor 1
            $alterado = $texto.Replace($m.Groups[1].Value, [Convert]::ToBase64String($b))
            if (-not (Test-FirmaEntrega -Texto $alterado -Archivo 'Actualizador-9.9.9.zip' -Version '9.9.9' -Sha256 $sha -Claves $claves)) { throw 'aceptó una firma alterada' }
            [IO.File]::WriteAllText((Join-Path $dir 'linea.txt'), $linea)
            [IO.File]::WriteAllText((Join-Path $dir 'firma.txt'), $texto)
            "ACTUALIZADOR_FIRMA_PRUEBA=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host 'Firma de prueba: correcta.'
          } finally { Remove-Item -LiteralPath ('Cert:\CurrentUser\My\' + $cert.Thumbprint) -DeleteKey -ErrorAction SilentlyContinue }

      # 2.0.44: Instalar.cmd del código fuente, en un equipo sin el SDK de .NET 8, baja la versión ya publicada (Get-EntregaPublicada).
      # Se prueba de verdad con la última publicada: descarga, SHA-256, contenido y SHA256SUMS.txt.
      - name: Instalar.cmd sin SDK (bajar y verificar la última versión publicada)
        if: steps.version.outputs.publicada != 'true'
        shell: powershell
        run: |
          . .\build\Comun.ps1
          $ErrorActionPreference = 'Continue'
          $tag = [string](gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName 2>$null)
          if (-not $tag) { Write-Host 'Todavía no hay versiones publicadas: no hay qué probar.'; exit 0 }
          $salida = Join-Path $env:RUNNER_TEMP 'entrega-publicada\Actualizador'
          if (-not (Get-EntregaPublicada -Version $tag.TrimStart('v') -Salida $salida -Repo $env:GITHUB_REPOSITORY)) { exit 1 }
          if (-not (Test-Path -LiteralPath (Join-Path $salida 'Actualizador.exe'))) { exit 1 }
          Write-Host "Correcto: $tag bajada y verificada."

      - name: Compilar, probar y publicar
        if: steps.version.outputs.publicada != 'true'
        shell: powershell
        run: |
          & .\build\Publicar.ps1 -Repo $env:GITHUB_REPOSITORY -ConPruebas
          if (-not $?) { exit 1 }
